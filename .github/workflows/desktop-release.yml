name: Desktop installers

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # This GitHub-hosted image is Apple Silicon, so node-pty matches the DMG.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # GitHub's artifact endpoint intermittently returns 502/504 to hosted
      # runners. The mirror hosts the same Electron archives and checksums.
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and sign desktop installers
        run: pnpm desktop:dist
        env:
          # Avoid the shared, unauthenticated GitHub API quota on hosted runners.
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm test:desktop
      - run: pnpm test:task-pool
      - run: pnpm test:installers
      - name: Run packaged-app onboarding with authenticated Herdr download
        run: pnpm test:onboarding
        env:
          # The packaged app performs the same official release discovery a
          # user sees. Authenticate it so hosted-runner IP quotas cannot turn a
          # product regression test into a GitHub 403.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: apps/desktop/release/installers/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: installers
      - name: Attach verified installers to a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Crewvane｜协航 0.6.6 · macOS Apple Silicon

          ## 本版更新

          - “等待外部”只用于等待人和 Agent 之外的真实第三方；需要你决定、Agent 正在协调或内部交接不会再被错误归入等待。
          - 待办池在侧边栏直接显示未结束事项数量；“先记下”和“我来做”会统一计入，完成、移出和恢复后实时更新。
          - 已完成或已放弃的管家目标支持“重启目标”。写一条给管家的新说明即可续接原目标；保存了 Herdr Agent 会话标识时会优先恢复原负责人会话，并重新绑定真实现场。
          - 重启会保留原目标的消息、附件和事件历史；没有可恢复会话标识时明确启动新负责人，不会假装恢复了旧上下文。
          - 顶部栏固定在应用顶部，只有页面内容滚动，长设置页和长目标列表不会再滚走导航与“新目标”入口。
          - 全局主题从靛蓝调整为更克制的墨青与海沫青，提醒使用暖琥珀；深浅主题的正文、状态文字与实底按钮均通过 WCAG AA 对比度审计。
          - 逐页重做注意力、待办池、全部目标、设置、目标详情与新建目标的层级和交互细节；补齐跳转主内容、键盘焦点、当前导航、可访问计数和折叠侧栏状态。
          - 修复右上角管家状态标签在 `error` / `ready` 状态下被通用样式挤歪的问题；状态标签现在固定 36px，并与“新目标”按钮保持同一垂直中心。
          - macOS 应用图标换成魔法师角色的现代简化版：保留偏斜兜帽、双眼和薄荷流带，去掉像素、星环与全身细节，Dock 和菜单栏缩小后仍保持清晰。

          0.6.5 的静默负责人核对、0.6.4 的系统剪贴板、0.6.3 的终端选择、0.6.2 的 Webhook 去重、0.6.1 的长文本目标，以及 0.6.0 的注意力、场景优先、工作区恢复与 Herdr 同步能力保持不变。

          ## 安装

          仅支持 Apple Silicon Mac（arm64）。从 Assets 下载 .dmg，将 Crewvane.app 拖入 Applications；也可下载 .zip 解压安装。
          SHA256SUMS.txt 可用于校验下载文件。GitHub 自动生成的 Source code 是源码，不是安装包。
          安装或替换应用后，请在设置中重新安装 Crewvane CLI，并按需安装或更新 Crewvane Skills。
          旧版、未来版本、损坏或缺快照的工作区会先完整备份，再自动创建兼容的新工作区。
          本内测版没有 Apple Developer ID 签名与公证，macOS 可能提示无法验证开发者。
          核对发布来源后，可在系统设置 > 隐私与安全性中按提示选择仍要打开。
          使用说明：https://github.com/gdli6177/crewvane/blob/main/docs/crewvane.md
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json; then
            test "$(jq -r .isDraft existing.json)" = true || { echo 'Published release is immutable to this workflow'; exit 1; }
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --prerelease --verify-tag \
              --title "Crewvane $RELEASE_TAG" --notes-file notes.md
          fi
