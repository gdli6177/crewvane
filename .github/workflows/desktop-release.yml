name: Desktop installers

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # This GitHub-hosted image is Apple Silicon, so node-pty matches the DMG.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # GitHub's artifact endpoint intermittently returns 502/504 to hosted
      # runners. The mirror hosts the same Electron archives and checksums.
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and sign desktop installers
        run: pnpm desktop:dist
        env:
          # Avoid the shared, unauthenticated GitHub API quota on hosted runners.
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm test:desktop
      - run: pnpm test:task-pool
      - run: pnpm test:installers
      - run: pnpm test:terminal
      - name: Run packaged-app onboarding with authenticated Herdr download
        run: pnpm test:onboarding
        env:
          # The packaged app performs the same official release discovery a
          # user sees. Authenticate it so hosted-runner IP quotas cannot turn a
          # product regression test into a GitHub 403.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: apps/desktop/release/installers/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: installers
      - name: Attach verified installers to a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Crewvane｜协航 0.9.1 · macOS Apple Silicon

          ## 本版更新

          - 0.9.0 提前发布的自主目标继续保留，但首次进入目标界面不再弹出自主推进设置；实验设置默认折叠，普通主线恢复为注意力、管家和工作现场。
          - “回到现场”默认打开 Terminal、iTerm2 或 Ghostty 中的同一 Herdr Session，并优先复用已有窗口；Terminal 使用免自动化权限的 LaunchServices 路径，原生组合键、图片粘贴和输入法使用真实终端能力。
          - 设置中可明确选择外部终端或内嵌轻现场，所选模式会真正用于“回到现场”，内嵌标题栏仍可强制在外部打开。
          - 内嵌轻现场补齐仅图片剪贴板桥：检测到图片后向当前 Agent 发送一次 Ctrl+V，由 Agent 自己读取系统剪贴板。
          - 外部终端未安装、自动化权限被拒绝或打开失败时给出可操作提示，可退回内嵌轻现场，不改变目标或 Herdr Session。
          - 负责人暂时空闲不再被误报成异常待办：已有下一步时显示“按计划跟进”，缺少下一步时显示“待管家更新”；真正的决定、验收、排障和到期跟进仍进入注意力。
          - 保留 v3 数据与在途自主目标，不做破坏性回滚；Agent Hooks、协调收件箱、一次回执提醒、Webhook 和注意力规则继续可用。

          ## 安装

          仅支持 Apple Silicon Mac（arm64）。从 Assets 下载 .dmg，将 Crewvane.app 拖入 Applications；也可下载 .zip 解压安装。
          SHA256SUMS.txt 可用于校验下载文件。GitHub 自动生成的 Source code 是源码，不是安装包。
          安装或替换应用后，请在设置中重新安装 Crewvane CLI，并检查“Agent 接入”。
          Codex 首次使用受管 Hook 时，请按 Codex 提示在 /hooks 中审核并信任 Crewvane 条目。
          有效 v3 工作区直接保留；有效 v2 会先备份到 .crewvane/state.v2.backup.json 后迁移到 v3。
          当前安装包没有 Apple Developer ID 签名与公证，macOS 可能提示无法验证开发者。
          核对发布来源后，可在系统设置 > 隐私与安全性中按提示选择仍要打开。
          使用说明：https://github.com/gdli6177/crewvane/blob/main/docs/crewvane.md
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json; then
            test "$(jq -r .isDraft existing.json)" = true || { echo 'Published release is immutable to this workflow'; exit 1; }
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --prerelease --verify-tag \
              --title "Crewvane $RELEASE_TAG" --notes-file notes.md
          fi
